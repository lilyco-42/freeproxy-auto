name: Update Free Nodes

on:
  schedule:
    - cron: '0 */3 * * *'      # 每 3 小时
  workflow_dispatch:          # 手动触发
  push:
    branches: [main]          # 仅当改到源/配置/脚本时重跑（output 提交不触发，避免循环）
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'config/**'
      - 'sources.txt'

concurrency:
  group: update-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：推送步骤 rebase 需要真实基线，浅克隆会加剧 non-fast-forward 失败
          fetch-depth: 0

      - name: Download subs-check & run one full check cycle
        shell: bash
        run: bash scripts/run-check.sh
        timeout-minutes: 45

      - name: Build output artifacts (clash.yaml / v2ray.txt / status.md)
        shell: bash
        run: |
          pip install --quiet pyyaml
          python3 scripts/build-artifacts.py --repo-root "$GITHUB_WORKSPACE"

      - name: Commit & push results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output README.md
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore: refresh free nodes $(date -u +'%Y-%m-%d %H:%M') UTC"
          # 推送竞态防护：run 期间若远端前进（定时/手动触发并发、人工提交），
          # 先 rebase 到最新再推；最多重试 3 次，每次失败后丢弃产物提交重来
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            echo "!! push rejected (attempt $i), rebasing onto latest origin/main"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          [ "$ok" -eq 1 ] || { echo "!! push failed after 3 attempts"; exit 1; }